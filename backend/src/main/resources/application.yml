spring:
  application:
    name: scot-erp
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/scot_erp_db}
    username: ${DATABASE_USERNAME:scot}
    password: ${DATABASE_PASSWORD:scot}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-dev-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-dev-google-client-secret}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            issuer-uri: https://accounts.google.com

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    allowed-email-domain: scot.lk
  jwt:
    secret: ${JWT_SECRET:scot-erp-dev-only-change-this-to-a-32-byte-secret!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: ${JWT_ISSUER:scot-erp}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/scot_erp_db
    username: scot
    password: scot
