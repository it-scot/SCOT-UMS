name: scot-erp

services:
  postgres:
    image: postgres:16-alpine
    container_name: scot-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scot_erp_db
      POSTGRES_USER: scot
      POSTGRES_PASSWORD: scot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scot -d scot_erp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scot-erp-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://postgres:5432/scot_erp_db
      DATABASE_USERNAME: scot
      DATABASE_PASSWORD: scot
      FRONTEND_ORIGIN: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-dev-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-dev-google-client-secret}
      JWT_SECRET: ${JWT_SECRET:-scot-erp-dev-only-change-this-to-a-32-byte-secret!}
    ports:
      - "8080:8080"
    profiles: ["apps"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scot-erp-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
      VITE_USE_API: "true"
    ports:
      - "3000:3000"
    profiles: ["apps"]

  adminer:
    image: adminer:latest
    container_name: scot_adminer
    ports:
      - "9090:8080"
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USER: scot
      ADMINER_DEFAULT_PASSWORD: scot
      ADMINER_DEFAULT_DB: scot_erp_db
    depends_on:
      - postgres
volumes:
  postgres_data:
    name: scot_erp_db_data
